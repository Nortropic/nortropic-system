#             echo "## ⛔ ODÖMBART — granskningen kördes aldrig"
#             echo
#             echo "**Detta är INTE ett fel i kandidaten.** Ingen nyckel i repot."
#             echo "Kör \`/install-github-app\`. En agent kan inte sätta secrets."
#           } >> "$GITHUB_STEP_SUMMARY"
#           # exit 2, inte 1: repots algebra är 0=PASS · 1=FAIL · 2=ODÖMBART. Actions ser
#           # bara rött, men exitkoden är repots egen och varje omslutande körare läser
#           # den. Mallen bar `exit 1` — samma kategorifel som FYND 4, oåtgärdat på det
#           # tredje jobbet. Fångat av andra granskningen, FYND F2, i en mall som annars
#           # hade klistrats in ordagrant den dag jobbet slås på.
#           exit 2
#       - name: Claude granskar diffen
#         if: steps.nyckel.outputs.finns == 'ja'
#         uses: anthropics/claude-code-action@v1
#         with:
#           anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
#           claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
