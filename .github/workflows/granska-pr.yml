#               1. .agents/skills/nortropic-reviewer/SKILL.md   (granskarrollen)
#               2. .agents/skills/nortropic-reviewer/PR-TILLAGG.md  (de nio felklasserna)
#             Sedan CLAUDE.md, AGENTS.md och docs/loop/regler.md — bindande, du
#             refererar dem och återger dem inte.
#             Du MERGAR ALDRIG och PUSHAR ALDRIG. Du skriver en granskning, inget annat.
