# granska-pr.yml — automatisk granskning av varje pull request.
#
# VARFÖR DEN FINNS. AGENTS.md kräver sedan 2026-09-17 att en PR granskas av någon
# annan än den som skrev den, innan merge. Kravet stod som text och följdes inte:
# 28 PR:er mergades av samma agent som öppnade dem. En regel som bara en människa
# kan minnas är exakt den felklass repot försöker bli av med — därför är granskningen
# en mekanism här, inte en rutin.
#
# Och behovet mättes samma dag: `check-provanropare.mjs` låg RÖD på main i nio och en
# halv timme utan att någon märkte det, eftersom ingenting körde vaktsviten automatiskt.
#
# DEN BLOCKERAR ALDRIG EN PUSH. Utlösaren är `pull_request`, aldrig `push`. Bevarande
# (autocommit, autopush, radda/*-grenar) publicerar ingenting och passerar aldrig
# den här filen — regel 12a. Att arbete kan bli liggande opushat är det problem
# mekanismen finns för att hindra, inte ett verktyg den får använda.
#
# DEN KÖR ALDRIG KÄRNANS EXITPROV. `controller/verify/cli` och `verify/bin/h-*-exit`
# är Darwin-bundna och faller på `undefined symbol: sysctl` under Linux. Fel maskin är
# ODÖMBART, aldrig FAIL (CLAUDE.md). Kördes de här hade varje PR bokfört en MILJÖ som
# ett fel i kandidaten, och röd CI hade slutat betyda något. Kärnans dom ligger kvar
# på Macen.
#
# VAD EN GRÖN KÖRNING SÄGER. Exakt: webbfabriken är inte söndrad, och de två
# skalproven under tests/scripts/ håller. Ingenting om kärnan. Citera den aldrig som
# bevis för kernelarbete (regel 8a — evidens är ytbunden).
#
# ── VERDIKTALGEBRAN I ETT TVÅVÄRT SYSTEM ────────────────────────────────────────
# `kor-vakter.mjs` rad 25 och skalproven deklarerar alla `0 = PASS · 1 = FAIL ·
# 2 = ODÖMBART`. GitHub Actions har bara grönt och rött. Första versionen av den här
# filen körde proven rakt av och bokförde därmed varje ODÖMBART som ett FEL I
# KANDIDATEN — precis det headern ovan förbjuder, applicerat på Darwin-grindarna men
# inte på jobben som faktiskt körs. Fångat av granskningen av den PR som införde filen.
#
# VALET, uttalat för att kunna ifrågasättas: ett ODÖMBART blir RÖTT, men skriver
# först en sammanfattning som säger i första raden att det ÄR odömbart och INTE ett
# fel i kandidaten. Skälet är att av de två möjliga missläsningarna är den falska
# gröna värre: en grön bock som betyder "kunde inte dömas" är den mekanism-som-ser-ut-
# att-finnas som hela repot handlar om, medan ett rött kryss vars första rad säger
# ODÖMBART inte går att missförstå och dessutom stoppar en merge tills någon tittar.
# Bokföringsinvändningen — att en miljö bokförs som ett kandidatfel — besvaras av att
# texten säger raka motsatsen, på den plats den läses.
#
# ── VAD DEN HÄR FILEN INTE KAN ──────────────────────────────────────────────────
# EN WORKFLOW KAN INTE HINDRA EN MERGE. Utan branch protection (required status
# checks) är varje jobb här rådgivande, och samma agent kan öppna och merga i samma
# minut med checken pending. Det kräver ÄGARENS HAND, en gång, och det är en ANDRA
# handling utöver nyckeln — se AGENTS.md.
#
#   Gör `vaktsviten` och `skalprov under tests/scripts` till REQUIRED.
#   Gör ALDRIG `granskning av diffen` required: den är rådgivande — skillen säger det
#   själv, *"Reviewer approval is never root of trust"* — och utan nyckel är den röd,
#   vilket som required check hade låst repot helt.
#
# OCH: `.github/workflows/**` vaktas av ingenting. Ingen `scripts/check-*.mjs` läser
# katalogen (`workflows/**` i regler.md §6 och `check-invariants.mjs` syftar på
# ROTKATALOGEN `workflows/`, en annan sak). Granskningsmekanismen kan alltså stängas av
# i en PR den själv granskar. `scripts/check-granskningsmekanismen.mjs` fäller den
# grövsta formen; branch protection är det verkliga svaret.

name: granska-pr

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Minsta möjliga. Granskaren läser koden och skriver en kommentar — den mergar
# aldrig, pushar aldrig och rör aldrig en gren.
permissions:
  contents: read
  pull-requests: write
  issues: write

# INGEN cancel-in-progress. Första versionen avbröt pågående körningar vid en ny push,
# och en AVBRUTEN körning är varken grön eller röd — en push strax före merge kunde
# alltså lämna PR:en utan dom alls. Att två körningar överlappar kostar sekunder;
# att en dom tyst försvinner är felklassen filen finns emot.
concurrency:
  group: granska-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # ── Den mekaniska domen ────────────────────────────────────────────────────
  vakter:
    name: vaktsviten (webbfabriken)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fullt djup: flera vakter läser historik, inte bara trädet. En grund
          # klon hade gjort dem ODÖMBARA utan att säga det.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: node scripts/kor-vakter.mjs
        run: |
          set +e
          node scripts/kor-vakter.mjs
          K=$?
          set -e
          if [ "$K" = "2" ]; then
            {
              echo "## ⛔ ODÖMBART — vaktsviten kunde inte dömas (exit 2)"
              echo
              echo "**Detta är INTE ett fel i kandidaten.** Något gick inte att MÄTA:"
              echo "en vakt nådde sin ODÖMBART-gren (saknad git-topp, hash som inte går"
              echo "att fastställa, en vakt som inte skrev sin signaturfras)."
              echo
              echo "Rött därför att ett ODÖMBART aldrig blir grönt — inte därför att"
              echo "diffen är fel. Läs jobbloggen och åtgärda mätbarheten, inte koden."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $K

  provsviter:
    name: skalprov under tests/scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Proven bygger sina egna engångsrepon och sitt eget $HOME. De når aldrig
      # nätet och rör aldrig arbetsträdet de ligger i.
      - name: skalproven
        run: |
          rc=0
          for p in tests/scripts/nortropic-autocommit/fall.sh \
                   tests/scripts/installera-hooks/fall.sh; do
            set +e
            bash "$p"
            K=$?
            set -e
            echo "── $p → exit $K"
            if [ "$K" = "2" ]; then
              {
                echo "## ⛔ ODÖMBART — \`$p\` kunde inte dömas (exit 2)"
                echo
                echo "**Detta är INTE ett fel i kandidaten.** Provet vägrade köra —"
                echo "det hittade inte skriptet det prövar, eller kunde inte bygga sin"
                echo "engångsvärld. Rött därför att ett ODÖMBART aldrig blir grönt."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            [ "$K" = "0" ] || rc="$K"
          done
          exit $rc

  # ── Granskningen ───────────────────────────────────────────────────────────
  granskning:
    name: granskning av diffen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Nyckeln läses som env, aldrig interpolerad in i ett kommando: en secret
      # som skrivs in i en `run`-rad hamnar i skalhistorik och felmeddelanden.
      # Bara tomheten prövas — värdet lämnar aldrig steget.
      #
      # Saknas den är jobbet ODÖMBART och alltså RÖTT, av samma skäl som ovan: en
      # grön bock som betyder "granskningen kördes aldrig" är värre än ett rött kryss
      # som säger varför. Därför får det här jobbet ALDRIG vara en required check —
      # då hade repot varit låst tills nyckeln fanns.
      - name: finns en nyckel?
        id: nyckel
        env:
          NYCKEL: ${{ secrets.ANTHROPIC_API_KEY }}
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$NYCKEL" ] || [ -n "$TOKEN" ]; then
            echo "finns=ja" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "finns=nej" >> "$GITHUB_OUTPUT"
          {
            echo "## ⛔ ODÖMBART — granskningen kördes aldrig"
            echo
            echo "**Detta är INTE ett fel i kandidaten.** Det finns ingen nyckel i repot,"
            echo "så Claude-steget kunde inte köra. Rött därför att ett ODÖMBART aldrig"
            echo "blir grönt — en grön bock här hade betytt \"granskad\" utan att vara det."
            echo
            echo "**ÄGARENS HAND, EN GÅNG:** kör \`/install-github-app\` i Claude Code."
            echo "Den installerar appen och sätter repo-secreten. En agent kan inte sätta"
            echo "secrets. (Manuellt: en secret under *Settings → Secrets and variables →"
            echo "Actions*, \`ANTHROPIC_API_KEY\` eller \`CLAUDE_CODE_OAUTH_TOKEN\`.)"
            echo
            echo "Till dess gäller AGENTS.md steg 2 för hand: en oberoende granskare som"
            echo "inte skrev koden läser diffen enligt"
            echo "\`.agents/skills/nortropic-reviewer/SKILL.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Claude granskar diffen
        if: steps.nyckel.outputs.finns == 'ja'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          display_report: true
          claude_args: '--max-turns 20'
          prompt: |
            Du granskar en pull request i Nortropics trust kernel.

            LÄS FÖRST, i denna ordning:
            `.agents/skills/nortropic-reviewer/SKILL.md` — repots EGEN granskarroll, och
            den som gäller. Följ dess hårda gräns och dess arbetsordning. Listan längre
            ner ersätter den inte; den lägger till vad som är PR-specifikt.
            Sedan `CLAUDE.md`, `AGENTS.md` och `docs/loop/regler.md`. De är bindande —
            du refererar dem, du återger dem inte.

            Att peka på rollskillen i stället för att skriva av den är avsiktligt: två
            definitioner av "granskning" i samma repo driver isär, och den som läses av
            en maskin vinner tyst över den som läses av en människa.

            Du MERGAR ALDRIG och PUSHAR ALDRIG. Du skriver en granskning, inget annat.
            Du är inte en andra grind på pushen: bevarande får aldrig hindras.

            Skriv granskningen på svenska. Var kort. Ett fynd som inte är belagt i
            diffen är brus — hellre tre skarpa än tolv möjliga. Verifiera varje
            misstanke mekaniskt innan du rapporterar den; kör proven, kör mutationer.

            Leta i första hand efter repots egna återkommande felklasser, i den här
            ordningen:

            1. ATT PRÖVA VAD UTDATA SÄGER I STÄLLET FÖR VAD MEKANISMEN GÖR. Ett prov
               som jämför ett namn, en sträng eller ett påstående i stället för ett
               utfall. Elva av tretton fel i det här repot kom av den metoden.
            2. EN MEKANISM SOM SER UT ATT FINNAS. Ny fil som `.gitignore`-vitlistan
               (rad 3 är `/*`) tyst svalt, kod ingen anropar, en hook eller workflow
               som aldrig kan köra. Fråga alltid: skulle detta faktiskt köras?
            3. ETT PROV SOM INTE KAN FÄLLA NÅGOT. Om diffen lägger till eller ändrar
               ett prov: mutera det prövade och kör provet. Fäller det inte, är det
               dekoration. Pröva särskilt om provet fäller den SENAST LAGADE buggen i
               filen — gör det inte det, skyddar det inte mot en regress.
            4. EN MILJÖ BOKFÖRD SOM ETT FEL. Verdiktalgebran är 0=PASS, 1=FAIL,
               2=ODÖMBART. Fel maskin, saknad nyckel eller saknat beroende är
               ODÖMBART och blir aldrig grönt av att något annat är grönt.
            5. REGEL 22 — teknisk ändring och dess dokumentation i samma commit.
               Hemvisten för kernelarbete är `docs/loop/drift.md` och
               `docs/05-beslutslogg.md`; rör ändringen webbfabrikslagret gäller
               `docs/00-borja-har.md`. Saknas raden, säg det.
            6. EN §A-YTA ÄNDRAD. `docs/07-konstitution.md`, `docs/03-regelverk.md` och
               `CLAUDE.md` ändras bara av en människa. Rör diffen dem är det ett fynd,
               oavsett hur rimlig ändringen ser ut.
            7. EN HEMLIGHET I TRÄDET. Ägarens regel: konfigurationen bär SÖKVÄGEN till
               en hemlighet, aldrig värdet — en config visas i rapporter och
               felmeddelanden.
            8. ETT PÅSTÅENDE OM LÄGET I FEL FIL. Teknisk status hör hemma i
               `docs/loop/drift.md` och `docs/05-beslutslogg.md`. Står den någon
               annanstans i repot är det drift.
            9. ETT TAL SOM INTE STÄMMER. Pröva varje siffra och varje tidsangivelse i
               commit-texten, drift-posten och beslutsloggsraden mot repot. Nio av
               tretton kända fel i det här repot låg i UNDERLAGET, inte i koden.

            Granska HELA grenen mot basen, inte bara den senaste commiten — spetsen kan
            ha flyttat sedan arbetet började.

            Avsluta med en rad: `DOM: TILLSTYRKS` eller `DOM: FYND` — och vid FYND en
            mening om vad som måste ändras. Domen är rådgivande; en människa eller en
            annan agent fattar beslutet.
